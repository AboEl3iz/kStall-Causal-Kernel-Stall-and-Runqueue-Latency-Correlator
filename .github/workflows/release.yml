name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-release-binaries:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & eBPF Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            llvm \
            libelf-dev \
            libbpf-dev \
            linux-libc-dev \
            pkg-config \
            zlib1g-dev \
            bpftool \
            xz-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross / AArch64 Toolchain (if aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          cargo install cross --git https://github.com/cross-rs/cross || true

      - name: Build and Package Release Artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x ci/*.sh install.sh
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            ./ci/release.sh --target "${{ matrix.target }}"
            ./ci/verify-release.sh
          else
            # Build using cross or cargo with cross linker
            RUSTFLAGS="-C linker=aarch64-linux-gnu-gcc" \
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            PKG_CONFIG_ALLOW_CROSS=1 \
            ./ci/release.sh --target "${{ matrix.target }}" || {
              echo "Standard cross build failed, attempting with target release fallback..."
              ./ci/release.sh --target "${{ matrix.target }}" --skip-build || true
            }
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 5

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-release-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate Release Notes & Changelog
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          
          cat <<EOF > RELEASE_NOTES.md
          # kStall ${TAG_NAME}

          Low-overhead, in-kernel latency profiler and ghost latency correlator built with eBPF and Rust.

          ### Quick Install
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
          \`\`\`

          ### Quick Start
          \`\`\`bash
          # Run diagnostic health check
          sudo kstall doctor

          # Watch live stall outliers
          sudo kstall watch --threshold 2ms

          # Interactive TUI mode
          sudo kstall top
          \`\`\`

          ### Release Artifacts
          Inspect SHA-256 checksums attached below before installation.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            all-dist/*.tar.gz
            all-dist/*.tar.xz
            all-dist/*.sha256
            all-dist/manifest-*.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-container:
    name: Build & Publish Container Image (GHCR)
    runs-on: ubuntu-latest
    needs: [build-release-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-helm-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: [publish-github-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm Chart
        run: |
          mkdir -p helm-dist
          helm package deploy/helm/kstall --destination helm-dist/

      - name: Upload Helm Chart to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: helm-dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
