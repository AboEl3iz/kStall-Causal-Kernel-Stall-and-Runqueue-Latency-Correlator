apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kstall-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kstall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kstall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kstall
    spec:
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: kstall
          image: kstall:latest
          imagePullPolicy: IfNotPresent
          args:
            - "watch"
            - "--threshold"
            - "5ms"
            - "--format"
            - "json"
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_RESOURCE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: sys-kernel-tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
      volumes:
        - name: sys-kernel-tracing
          hostPath:
            path: /sys/kernel/tracing
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-kernel-btf
          hostPath:
            path: /sys/kernel/btf
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
